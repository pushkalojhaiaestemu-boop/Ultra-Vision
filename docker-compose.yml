services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      USE_MOCK_MODE: "${USE_MOCK_MODE:-true}"
      VISION_API_KEY: "${VISION_API_KEY:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      SEARCH_API_KEY: "${SEARCH_API_KEY:-}"
      MAX_RESEARCH_ITERATIONS: "${MAX_RESEARCH_ITERATIONS:-5}"
      DATABASE_PATH: /data/research.sqlite3
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
